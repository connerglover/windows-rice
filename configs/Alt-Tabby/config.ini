;;; Tertiary background (cards, hover zones)
; LightTertiary=0xEBEBEB
;;; Edit / input background
; LightEditBg=0xFFFFFF
;;; Hover highlight
; LightHover=0xE0E0E0
;;; Primary text
; LightText=0x0
;;; Edit / input text
; LightEditText=0x0
;;; Secondary text
; LightTextSecondary=0x444444
;;; Muted / disabled text
; LightTextMuted=0x666666
;;; Accent / link color
; LightAccent=0x66CC
;;; Accent hover state
; LightAccentHover=0x55AA
;;; Text on accent background
; LightAccentText=0xFFFFFF
;;; Standard border
; LightBorder=0xD0D0D0
;;; Input border
; LightBorderInput=0xBBBBBB
;;; Toggle switch off state
; LightToggleBg=0xCCCCCC
;;; Success indicator
; LightSuccess=0x2E7D32
;;; Warning indicator
; LightWarning=0xE65100
;;; Danger indicator
; LightDanger=0xC62828
;;; Enable custom title bar background and text colors on Win11. When off, Windows manages title bar colors.
; CustomTitleBarColors=false
;;; Dark mode title bar background
; DarkTitleBarBg=0x202020
;;; Dark mode title bar text
; DarkTitleBarText=0xE0E0E0
;;; Light mode title bar background
; LightTitleBarBg=0xF0F0F0
;;; Light mode title bar text
; LightTitleBarText=0x0
;;; Enable custom window border color on Win11. When off, Windows manages the border color.
; CustomTitleBarBorder=false
;;; Dark mode window border color
; DarkTitleBarBorder=0x60CDFF
;;; Light mode window border color
; LightTitleBarBorder=0x66CC
;;; Enable custom button hover/pressed colors. When off, buttons use standard Windows theme.
; CustomButtonColors=false
;;; Dark mode button hover background
; DarkButtonHoverBg=0x60CDFF
;;; Dark mode button hover text
; DarkButtonHoverText=0x202020
;;; Light mode button hover background
; LightButtonHoverBg=0x66CC
;;; Light mode button hover text
; LightButtonHoverText=0xFFFFFF
[Komorebi]
CrossWorkspaceMethod=SwitchActivate

;;; Milliseconds to wait after SwitchTo before returning (0 = no delay). Increase if cross-workspace activation is unreliable on slower systems.
; MimicNativeSettleMs=0
;;; Send commands directly to komorebi's named pipe instead of spawning komorebic.exe. Faster. Falls back to komorebic.exe if socket unavailable.
; UseSocket=true
; WorkspaceConfirmationMethod=PollCloak
;;; Legacy pipe poll interval. Used when overlapped I/O is unavailable.
; SubPollMs=50
;;; Background maintenance interval for subscription health monitoring. Ignored in legacy poll mode.
; SubMaintenanceMs=2000
;;; Restart subscription if no events for this long (stale detection)
; SubIdleRecycleMs=120000
;;; Fallback polling interval if subscription fails
; SubFallbackPollMs=2000
;;; Maximum age (ms) for cached workspace assignments before they are considered stale. Lower values track rapid workspace switching more accurately.
; SubCacheMaxAgeMs=10000
;;; Batch cloak/uncloak events during workspace switches (ms). 0 = disabled, push immediately.
; SubBatchCloakEventsMs=50
;;; Duration (ms) to suppress WinEventHook MRU updates after a workspace switch. Prevents focus events from corrupting window order during transitions.
; MruSuppressionMs=2000
;;; Retry interval (ms) for promoting from polling to subscription mode after komorebi starts. Lower = faster promotion when komorebi restarts, but more frequent probing.
; SubPromotionRetryMs=30000
;;; Delay (ms) before first komorebi state poll at startup. Allows komorebi pipe to initialize. Increase on slow systems where komorebi takes longer to start.
; SubInitialPollDelayMs=1500
;;; Polling interval (ms) for komorebi state when using Polling mode. Lower = more responsive workspace tracking, higher = less CPU. Only active when KomorebiIntegration=Polling.
; LitePollMs=1000
[Tools]
KomorebicExe=C:\Program Files\komorebi\bin\komorebic.exe

;;; Path to AHK v2 executable (for spawning subprocesses). Leave empty to auto-discover via PATH and known install locations
; AhkV2Path=
[Performance]
AnimationType=Minimal
AnimationFPS=60

;;; Compensate for HDR display gamma darkening. DWM composites in linear scRGB which darkens semi-transparent GPU blurs/glows. 'auto' detects HDR and applies correction, 'on' forces correction (useful for testing on SDR), 'off' disables.
; HDRCompensation=auto
;;; Gamma exponent for HDR compensation. Lower = brighter correction (more compensation). 0.80 restores SDR-equivalent brightness. Only effective when HDR compensation is active.
; HDRGammaExponent=0.8
;;; Set a hard working set floor after warm-up. Tells Windows not to trim resident memory below the measured baseline. Trades slightly higher steady-state memory for instant responsiveness after long idle.
; KeepInMemory=true
;;; Periodically read key data structures (icon cache, window store, GDI+ resources) to keep their memory pages resident. Runs on the housekeeping cycle with negligible CPU cost.
; ForceTouchMemory=true
;;; Process priority class. Higher priority ensures responsive Alt+Tab on busy systems. Idle elevated threads cost zero CPU — only matters when the process needs scheduling (hook callbacks, paint, pipe I/O). AboveNormal recommended.
; ProcessPriority=AboveNormal
;;; Animation duration multiplier. 1.0 = normal speed, 0.5 = twice as fast, 2.0 = half speed. Affects all animation durations.
; AnimationSpeed=1
;;; Decouple mouse shader framerate from the compositor. When a mouse shader exceeds the frame budget, it skips rendering on the next frame (reusing the cached result) while the rest of the overlay stays at full FPS.
; AdaptiveMouseFPS=true
[Shader.1]
ShaderName=

;;; Opacity of this shader layer. 0.0 = invisible, 1.0 = fully opaque.
; ShaderOpacity=0.5
;;; Darken post-processing. 0.0 = no darkening, 1.0 = fully dark.
; ShaderDarkness=0
;;; Desaturation post-processing. 0.0 = full color, 1.0 = grayscale.
; ShaderDesaturation=0
;;; Time speed multiplier for shader animation. 2.0 = twice as fast.
; ShaderSpeed=1
;;; Optional hotkey to cycle through shaders for this layer while overlay is visible.
; CycleShaderHotkey=
;;; Minimum random time offset (seconds) applied when shader is first loaded.
; ShaderTimeOffsetMin=30
;;; Maximum random time offset (seconds) applied when shader is first loaded.
; ShaderTimeOffsetMax=90
;;; When true, shader time persists across overlay show/hide cycles.
; ShaderTimeAccumulate=true
[Shader.2]
ShaderName=

[Shader.3]
ShaderName=

[Shader.4]
ShaderName=

[MouseEffect]
UseMouseEffect=false

;;; Mouse effect shader.
; Name=mouse_emberTrail
;;; Opacity of the mouse effect layer.
; Opacity=0.3
;;; Darken the mouse effect. 0 = no change, 1 = fully black.
; Darkness=0
;;; Desaturate the mouse effect. 0 = full color, 1 = grayscale.
; Desaturation=0
;;; Animation speed multiplier for the mouse effect.
; Speed=1
;;; Grid resolution for compute mouse effects. Low = 256×128 (~1 MB). Medium = 512×256 (~4 MB). High = 1024×512 (~16 MB, recommended). Ultra = 2048×1024 (~67 MB). Lower = better FPS.
; GridQuality=High
;;; Particle count multiplier. Lower = better FPS, fewer particles.
; ParticleDensity=1
;;; How strongly the cursor disturbs the effect. Higher = more dramatic.
; Reactivity=1
;;; Optional hotkey to cycle through mouse effects while overlay is visible.
; CycleHotkey=
[Diagnostics]
FlightRecorder=false

;;; Number of events kept in the flight recorder ring buffer. 2000 ≈ 30s of typical activity. Higher values capture more history at ~48 bytes per slot.
; FlightRecorderBufferSize=2000
;;; Hotkey to dump the flight recorder buffer. Use AHK v2 hotkey syntax (e.g. *F12, ^F12, +F11). * prefix = fire regardless of modifiers (works during Alt-Tab). Pass-through: the key still reaches other apps.
; FlightRecorderHotkey=*F12
;;; Hotkey to toggle the build-time profiler (start/stop). Use AHK v2 hotkey syntax (e.g. *F11, ^F11). * prefix = fire regardless of modifiers (works during Alt-Tab). Only functional in --profile builds.
; ProfilerHotkey=*F11
;;; Maximum profiler events in ring buffer. 50000 ≈ several minutes of heavy activity. Oldest events overwritten when full.
; ProfilerBufferSize=50000
;;; Debug viewer refresh interval (ms). Lower = more responsive viewer but slightly more CPU. Only applies while the viewer window is visible.
; ViewerRefreshMs=500
;;; Log revision bump sources to %TEMP%\\tabby_store_error.log. Use when store rev is churning rapidly when idle.
; ChurnLog=false
;;; Log komorebi subscription events to %TEMP%\\tabby_ksub_diag.log. Use when workspace tracking has issues.
; KomorebiLog=false
;;; Show tooltips for Alt-Tab state machine debugging. Use when overlay behavior is incorrect.
; AltTabTooltips=false
;;; Log Alt-Tab events to %TEMP%\\tabby_events.log. Use when debugging rapid Alt-Tab or event timing issues.
; EventLog=false
;;; Log WinEventHook focus events to %TEMP%\\tabby_weh_focus.log. Use when focus tracking issues occur.
; WinEventLog=false
;;; Log MainProcess startup and operational info to %TEMP%\\tabby_store_error.log. Use for general debugging.
; StoreLog=false
;;; Log icon pump operations to %TEMP%\\tabby_iconpump.log. Use when debugging icon resolution issues (cloaked windows, UWP apps).
; IconPumpLog=false
;;; Log process pump operations to %TEMP%\\tabby_procpump.log. Use when debugging process name resolution failures.
; ProcPumpLog=false
;;; Log EnrichmentPump operations to %TEMP%\\tabby_pump.log. Use when debugging icon/title/process enrichment in the pump subprocess.
; PumpLog=false
;;; Log launcher startup to %TEMP%\\tabby_launcher.log. Use when debugging startup issues, subprocess launch, or mutex problems.
; LauncherLog=false
;;; Log IPC pipe operations to %TEMP%\\tabby_ipc.log. Use when debugging pump IPC communication issues.
; IPCLog=false
;;; Log GUI paint timing to %TEMP%\\tabby_paint_timing.log. Use when debugging slow overlay rendering after extended idle.
; PaintTimingLog=false
;;; Log WebView2 config editor errors to %TEMP%\\tabby_webview_debug.log. Use when debugging config editor issues.
; WebViewLog=false
;;; Log auto-update check and apply steps to %TEMP%\\tabby_update.log. Use when debugging update failures.
; UpdateLog=false
;;; Log D3D11 shader pipeline operations to %TEMP%\\tabby_shader.log. Use when debugging shader compilation, texture loading, or rendering issues.
; ShaderLog=false
;;; Track usage statistics (Alt-Tabs, quick switches, etc.) and persist to stats.ini. Shown in the dashboard.
; StatsTracking=true
;;; Prefix inserted into diagnostic log filenames for instance isolation. When set, tabby_pump.log becomes tabby_pump_<prefix>.log. Used by automated tests to prevent log collision across parallel worktrees.
; LogFilePrefix=
;;; Maximum diagnostic log file size in KB before trimming.
; LogMaxKB=100
;;; Size to keep after log trim in KB. Must be less than LogMaxKB.
; LogKeepKB=50
[BackgroundImage]

;;; Enable the background image layer. When false, no image is loaded or rendered.
; Enabled=false
;;; When true, the background image renders above shader layers (image is the visual focus). When false, renders below shader layers (image is a backdrop for shaders).
; RenderAboveShaders=true
;;; Path to the background image file. Use the Browse button to select an image — it will be copied to the resources folder for portability.
; ImagePath=
;;; How the image fits the overlay. Fill = cover (may crop). Fit = contain (may letterbox). Stretch = distort to fill. Tile = repeat at natural size. Fixed = natural size, no scaling.
; FitMode=Fill
;;; Anchor point for Fill (crop origin), Fit (position within letterbox), and Fixed (position within overlay). Ignored for Stretch and Tile.
; Alignment=Center
;;; Image scale multiplier. Applies to Fixed and Fit modes only — other modes determine their own sizing.
; Scale=1
;;; Rendering filter for scaled images. Sharp = pixel-perfect (nearest neighbor), best for upscaling pixel art. Smooth = bilinear, good all-around. HighQuality = bicubic, best for downscaling photos. Applies to all modes that resize the image.
; ScaleFilter=Sharp
;;; Opacity of the background image layer. 0.0 = invisible, 1.0 = fully opaque.
; Opacity=1
;;; Gaussian blur radius applied to the background image. 0.0 = sharp, higher values increase blur.
; BlurRadius=0
;;; Desaturation applied to the background image. 0.0 = full color, 1.0 = grayscale.
; Desaturation=0
;;; Brightness adjustment for the background image. -1.0 = fully dark, 0.0 = no change, 1.0 = fully bright.
; Brightness=0
;;; Render a drop shadow behind the image. Best with transparent PNGs. Visible in Fixed and Fit modes.
; ShadowEnabled=false
;;; Shadow blur radius in pixels.
; ShadowRadius=10
;;; Shadow opacity. 0.0 = invisible, 1.0 = fully opaque.
; ShadowOpacity=0.5
;;; Horizontal shadow offset in pixels.
; ShadowOffsetX=4
;;; Vertical shadow offset in pixels.
; ShadowOffsetY=4
[Capture]

;;; Master switch. When false, no hotkeys registered, zero overhead.
; Enable=false
;;; Hotkey for screenshot capture. Blank = disabled. Example: F10. Wildcard (*) auto-prefixed so it fires while Alt is held.
; ScreenshotHotkey=
;;; Hotkey to start video recording via ffmpeg. Blank = disabled. Requires ffmpeg on PATH.
; RecordStartHotkey=
;;; Hotkey to stop video recording. Blank = disabled.
; RecordStopHotkey=
[IPC]

;;; Named pipe name for enrichment pump communication
; PumpPipeName=tabby_pump_v1
;;; Pump poll interval when idle (ms). Lower = more responsive but more CPU.
; IdleTickMs=100
[Shader]
UseShaderLayers=false

[Store]


;;; Komorebi integration mode. Always = subscription with polling fallback and auto-retry (recommended). Polling = periodic state polling only. Never = disabled.
; KomorebiIntegration=Always
;;; How to resolve window icons and process names. Always = separate process with in-process fallback (recommended). NonBlocking = separate process only, no fallback. ProcessOnly = in-process only, saves memory. Never = disabled.
; AdditionalWindowInformation=Always
;;; Interval to clean up cached icons for closed windows
; PumpIconPruneIntervalMs=300000
;;; Time (ms) without a pump response before declaring it hung and restarting
; PumpHangTimeoutMs=15000
;;; How often the pump batches pending hwnds into enrich requests (ms). Lower = faster icon/process resolution, higher = fewer IPC roundtrips.
; PumpCollectIntervalMs=50
;;; Empty queue ticks before pausing collection timer. Lower = faster idle detection, higher = more responsive to bursts.
; PumpIdleThreshold=5
;;; Filter windows like native Alt-Tab (skip tool windows, etc.)
; UseAltTabEligibility=true
;;; Apply blacklist filtering to exclude specific windows
; UseBlacklist=true
;;; Ignore rapid duplicate events (e.g., dragging a window fires many events)
; DebounceMs=50
;;; Batch processing interval - how often queued events are processed
; BatchMs=100
;;; Empty batch ticks before pausing timer. Lower = faster idle detection, higher = more responsive to bursts.
; WinEventHookIdleThreshold=10
;;; Minimum interval between cosmetic repaints while overlay is active (ms). Prevents animated titles from flooding repaints. 0 = no debounce.
; ActiveRepaintDebounceMs=250
;;; How often to check for windows needing Z-order updates (ms)
; ZPumpIntervalMs=200
;;; Grace period before removing a missing window (ms). Shorter values remove ghost windows faster (Outlook/Teams). Longer values tolerate slow-starting apps.
; MissingWindowGraceMs=1200
;;; Polling interval when WinEventHook fails and fallback scanning is active (ms). Lower = more responsive but higher CPU.
; FallbackScanIntervalMs=2000
;;; Safety polling interval (0=disabled, or 30000+ for safety net)
; SafetyPollMs=0
;;; How often to check for dead/zombie windows (ms). Lightweight check that removes windows that no longer exist. 0 = disabled.
; ValidateExistenceMs=5000
;;; Polling interval for focus tracking fallback
; PollMs=250
;;; How often the pump processes its queue
; IconPumpIntervalMs=80
;;; Max icons to process per tick (prevents lag spikes)
; IconPumpBatchSize=16
;;; Max attempts before giving up on a window's icon
; MaxAttempts=4
;;; Base backoff after failed attempt (multiplied by attempt number)
; AttemptBackoffMs=300
;;; Backoff multiplier for exponential backoff (1.0 = linear)
; BackoffMultiplier=1.8
;;; Long cooldown (ms) after max icon resolution attempts are exhausted. Lower values retry sooner for problematic apps.
; GiveUpBackoffMs=5000
;;; Minimum time between icon refresh checks per window (ms). Icons are rechecked on focus and title change. The per-window throttle prevents spam from terminals with animated titles.
; RefreshThrottleMs=5000
;;; Re-check window icons when title changes (e.g., browser tab switch). Per-window throttle (RefreshThrottleMs) prevents spam.
; IconRefreshOnTitleChange=true
;;; Empty queue ticks before pausing timer. Lower = faster idle detection, higher = more responsive to bursts.
; IconPumpIdleThreshold=5
;;; WM_GETICON timeout in milliseconds. Increase for slow or hung applications that need more time to respond.
; ResolveTimeoutMs=500
;;; How often the pump processes its queue
; ProcPumpIntervalMs=100
;;; Max PIDs to resolve per tick
; ProcPumpBatchSize=16
;;; Empty queue ticks before pausing timer. Lower = faster idle detection, higher = more responsive to bursts.
; ProcPumpIdleThreshold=5
;;; How long (ms) before retrying process name lookup for a PID that previously failed.
; FailedPidRetryMs=60000
;;; Maximum number of cached UWP logo paths. Prevents repeated manifest parsing for multi-window UWP apps.
; UwpLogoMax=50
;;; Interval (ms) between housekeeping cycles: cache pruning, log rotation, and stats flush. Lower = more responsive cleanup but slightly more CPU. Default 5 minutes.
; HousekeepingIntervalMs=300000


[Setup]
FirstRunCompleted=true
AutoUpdateCheck=true
RunAsAdmin=false

;;; Full path to AltTabby.exe after installation. Empty = use current location.
ExePath={{RICE_ROOT}}\Alt-Tabby\AltTabby.exe
;;; Don't prompt to repair stale admin task. Set automatically when user clicks 'Don't ask again'.
; SuppressAdminRepairPrompt=false
[Launcher]
SplashScreen=None

;;; Image splash screen display duration in milliseconds (includes fade time). Set to 0 for minimum.
; SplashImageDurationMs=3000
;;; Image splash screen fade in/out duration in milliseconds.
; SplashImageFadeMs=500
;;; Fade in duration while frozen on first frame (ms). 0 = skip fixed fade in.
; SplashAnimFadeInFixedMs=0
;;; Fade in duration while animation plays (ms). 0 = skip animated fade in.
; SplashAnimFadeInAnimMs=500
;;; Fade out duration while animation plays (ms). 0 = skip animated fade out.
; SplashAnimFadeOutAnimMs=500
;;; Fade out duration while frozen on last frame (ms). 0 = skip fixed fade out.
; SplashAnimFadeOutFixedMs=0
;;; Number of animation loops before auto-closing. 0 = loop forever (requires manual dismiss).
; SplashAnimLoops=1
;;; Streaming decode buffer size. 0 = load all frames upfront (~500MB). >0 = buffer N frames (~4MB per frame at 1280x720). Default 24 = ~88MB, 1 second buffer at 24fps.
; SplashAnimBufferFrames=24
;;; Always use the native AHK config editor instead of the WebView2 version.
; ForceNativeEditor=false
;;; Show the Dev menu and extra editor options in the tray menu. Useful for testing dialogs and debugging.
; ShowTrayDebugItems=false
;;; Scroll speed for the native config editor (pixels per mouse wheel notch). Increase for faster scrolling through settings, decrease for precision.
; EditorScrollStep=60
[AltTab]
GraceMs=120
BypassFullscreen=true

;;; Maximum time for quick switch without showing the overlay (ms). If Alt+Tab and release happen within this time, instant switch.
; QuickSwitchMs=100
;;; Activate window immediately when clicking a row (like Windows native). When false, clicking selects the row and activation happens when Alt is released.
; SwitchOnClick=true
;;; Polling interval (ms) when switching to a window on a different workspace. Lower = more responsive but higher CPU.
; AsyncActivationPollMs=15
;;; Fraction of screen dimensions a window must cover to be considered fullscreen. Lower values catch borderless windowed games that don't quite fill the screen.
; BypassFullscreenThreshold=0.99
;;; Maximum pixels from screen edge for a window to still be considered fullscreen. Increase if borderless windows are offset by more than 5px.
; BypassFullscreenTolerancePx=5
;;; Comma-separated list of process names to bypass (e.g., 'game.exe,vlc.exe'). When these processes are in the foreground, native Windows Alt-Tab is used instead.
; BypassProcesses=
;;; Alt key timing tolerance window (ms). After Alt is released, Tab presses within this window are still treated as Alt+Tab. Increase for slower typing speeds.
; AltLeewayMs=60
;;; Timeout when polling for workspace switch completion (ms). Used during cross-workspace activation.
; WSPollTimeoutMs=200
;;; Tab decision window (ms). When Tab is pressed, we wait this long before committing to show the overlay. Allows detecting rapid Tab releases. Lower = more responsive but may cause accidental triggers.
; TabDecisionMs=24
;;; Wait time after workspace switch (ms). When activating a window on a different komorebi workspace, we wait this long for the workspace to stabilize before activating the window. Increase if windows fail to activate on slow systems.
; WorkspaceSwitchSettleMs=75
;;; Delay (ms) before forcing DWM to re-sample the acrylic backdrop after a workspace switch. Komorebi cloaking is asynchronous — this delay lets the desktop settle before the refresh. Increase if the acrylic still shows stale content after switching workspaces.
; BackdropRefreshDelayMs=250
;;; When the selected window has been closed during overlay display, automatically activate the next window in the MRU list instead of doing nothing.
; ActivationRetry=true
;;; Maximum number of retry attempts when walking the MRU list for a live window. 0 = unlimited (walk entire list). Non-zero caps the search depth.
; ActivationRetryDepth=0
[GUI]
BackdropStyle=Solid
AcrylicColor=0xFF272E33
CornerStyle=RoundSmall
ScreenWidthPct=0.38
RowsVisibleMax=7
RowHeight=56
RowRadius=6
UseSelectionEffect=false
UseHoverSelectionEffect=false
SelARGB=0xFF374145
SelBorderARGB=0xFFA7C080
SelBorderWidthPx=1
HoverARGB=0x55374145
MainFontName=JetBrainsMono Nerd Font
MainFontNameHi=JetBrainsMono Nerd Font
MainFontSize=16
MainFontSizeHi=16
MainARGB=0xFFD3C6AA
MainARGBHi=0xFFA7C080
SubARGB=0xFF859289
SubARGBHi=0xFFD3C6AA
ColARGB=0xFF859289
ColARGBHi=0xFFD3C6AA
HdrARGB=0xFFA7C080

;;; Take focus when overlay appears. Required for Mica backdrop tint. Auto-enabled when BackdropStyle is Mica or MicaAlt.
; StealFocus=false
;;; Which monitor the overlay appears on. FocusedWindow = the monitor where you're working. Primary = always the primary monitor.
; OverlayMonitor=FocusedWindow
;;; Default monitor filter. All = windows from all monitors. Current = only windows on the overlay's monitor. Toggle with backtick key during use.
; MonitorFilterDefault=All
;;; Minimum visible rows
; RowsVisibleMin=1
;;; Horizontal margin in pixels
; MarginX=18
;;; Vertical margin in pixels
; MarginY=18
;;; Icon size in pixels
; IconSize=36
;;; Left margin before icon in pixels
; IconLeftMargin=8
;;; Gap between icon and title text in pixels
; IconTextGapPx=12
;;; Gap between right-side data columns in pixels
; ColumnGapPx=10
;;; Header row height in pixels
; HeaderHeightPx=28
;;; Hover row border color (ARGB). Drawn when HovBorderWidthPx > 0.
; HovBorderARGB=0x0
;;; Hover row border stroke width in pixels. Set to 0 to disable the border.
; HovBorderWidthPx=0
;;; Shader-based selection effect.
; SelectionEffect=selection_auroraSel
;;; Optional hotkey to cycle through selection effects while overlay is visible.
; SelectionCycleHotkey=
;;; Use any background shader as the selection effect instead. Applies Opacity, Darkness, Desaturation, and Speed settings below. Selection-specific Glow and Intensity are ignored.
; UseBGShaderAsSelection=false
;;; Background shader to use as the selection effect.
; BGShaderAsSelection=domainWarpingTest
;;; Clip shows a window into the full-size shader. Resize fits the entire shader into the selection rect.
; BGShaderAsSelectionSize=Clip
;;; Selection shader opacity (0.0 = invisible, 1.0 = full).
; SelectionOpacity=1
;;; Crush selection effect toward black without affecting transparency.
; SelectionDarkness=0
;;; Desaturate the selection effect toward grayscale.
; SelectionDesaturation=0
;;; Animation speed multiplier for selection shaders.
; SelectionSpeed=1
;;; Outer glow radius multiplier. Scales how far the effect bleeds beyond the selection border.
; SelectionGlow=1
;;; Effect blend strength. Scales how much the shader effect overrides the base fill color.
; SelectionIntensity=1
;;; Intensity when the selection shader is reused for hover. For selection shaders, dims the effect. For BG-as-selection shaders, acts as opacity. Only applies when no independent hover shader is configured.
; SelectionIntensityForHover=0.5
;;; Shader effect for hover rows.
; HoverSelectionEffect=selection_glass
;;; Optional hotkey to cycle through hover shader effects while overlay is visible.
; HoverSelectionCycleHotkey=
;;; Use a background shader as the hover effect instead of a selection shader.
; UseBGShaderAsHoverSelection=false
;;; Background shader to use as the hover effect.
; HoverBGShaderAsSelection=domainWarpingTest
;;; Clip shows a window into the full-size shader. Resize fits the entire shader into the hover rect.
; HoverBGShaderAsSelectionSize=Clip
;;; Hover shader opacity (0.0 = invisible, 1.0 = full).
; HoverSelectionOpacity=0.8
;;; Crush hover effect toward black without affecting transparency.
; HoverSelectionDarkness=0
;;; Desaturate the hover effect toward grayscale.
; HoverSelectionDesaturation=0
;;; Animation speed multiplier for hover shader.
; HoverSelectionSpeed=1
;;; Outer glow radius multiplier for hover effect. Scales how far the effect bleeds beyond the hover border.
; HoverSelectionGlow=0.5
;;; Effect blend strength for hover shader. Scales how much the shader effect overrides the base fill color.
; HoverSelectionIntensity=1
;;; Enable text drop shadows behind window titles for readability.
; UseTextShadow=true
;;; Text shadow opacity (0x58 = default).
; TextShadowAlpha=0x58
;;; Text shadow offset in DIP pixels.
; TextShadowDistancePx=1.5
;;; Enable inner shadow along overlay edges. Creates a recessed glass effect.
; UseInnerShadow=true
;;; Inner shadow opacity at the window edge (0x2A = default). Bottom and side edges are proportionally softer.
; InnerShadowAlpha=0x2A
;;; Inner shadow depth along window edges in DIP pixels.
; InnerShadowDepthPx=10
;;; Keep selection at top when scrolling
; ScrollKeepHighlightOnTop=true
;;; Text shown when no windows available
; EmptyListText=No Windows
;;; Tooltip display duration in milliseconds. Increase for accessibility.
; TooltipDurationMs=2000
;;; Hover state polling interval (ms). Lower = more responsive but higher CPU.
; HoverPollIntervalMs=100
;;; Show close button on hover
; ShowCloseButton=true
;;; Show kill button on hover
; ShowKillButton=false
;;; Show blacklist button on hover
; ShowBlacklistButton=true
;;; Action button size in pixels
; ActionBtnSizePx=24
;;; Gap between action buttons in pixels
; ActionBtnGapPx=6
;;; Action button corner radius
; ActionBtnRadiusPx=6
;;; Action button font name
; ActionFontName=Segoe UI Symbol
;;; Action button font size
; ActionFontSize=18
;;; Action button font weight
; ActionFontWeight=700
;;; Close button border width
; CloseButtonBorderPx=1
;;; Close button border color (ARGB)
; CloseButtonBorderARGB=0x88FFFFFF
;;; Close button background color (ARGB)
; CloseButtonBGARGB=0xFF000000
;;; Close button background color on hover (ARGB)
; CloseButtonBGHoverARGB=0xFF888888
;;; Close button text color (ARGB)
; CloseButtonTextARGB=0xFFFFFFFF
;;; Close button text color on hover (ARGB)
; CloseButtonTextHoverARGB=0xFFFF0000
;;; Close button glyph character
; CloseButtonGlyph=X
;;; Kill button border width
; KillButtonBorderPx=1
;;; Kill button border color (ARGB)
; KillButtonBorderARGB=0x88FFB4A5
;;; Kill button background color (ARGB)
; KillButtonBGARGB=0xFF300000
;;; Kill button background color on hover (ARGB)
; KillButtonBGHoverARGB=0xFFD00000
;;; Kill button text color (ARGB)
; KillButtonTextARGB=0xFFFFE8E8
;;; Kill button text color on hover (ARGB)
; KillButtonTextHoverARGB=0xFFFFFFFF
;;; Kill button glyph character
; KillButtonGlyph=K
;;; Blacklist button border width
; BlacklistButtonBorderPx=1
;;; Blacklist button border color (ARGB)
; BlacklistButtonBorderARGB=0x88999999
;;; Blacklist button background color (ARGB)
; BlacklistButtonBGARGB=0xFF000000
;;; Blacklist button background color on hover (ARGB)
; BlacklistButtonBGHoverARGB=0xFF888888
;;; Blacklist button text color (ARGB)
; BlacklistButtonTextARGB=0xFFFFFFFF
;;; Blacklist button text color on hover (ARGB)
; BlacklistButtonTextHoverARGB=0xFFFF0000
;;; Blacklist button glyph character
; BlacklistButtonGlyph=B
;;; Show column headers
; ShowHeader=true
;;; Column 2 width (HWND)
; ColFixed2=70
;;; Column 3 width (PID)
; ColFixed3=50
;;; Column 4 width (Workspace)
; ColFixed4=60
;;; Column 5 width — Monitor label (0=hidden). Set to 50 to show Mon 1/Mon 2 per row.
; ColFixed5=0
;;; Column 6 width (0=hidden)
; ColFixed6=0
;;; Column 2 header name
; Col2Name=HWND
;;; Column 3 header name
; Col3Name=PID
;;; Column 4 header name
; Col4Name=WS
;;; Column 5 header name (Monitor label)
; Col5Name=Mon
;;; Column 6 header name
; Col6Name=
;;; Header font name
; HdrFontName=Segoe UI
;;; Header font size
; HdrFontSize=12
;;; Header font weight
; HdrFontWeight=600
;;; Main font weight
; MainFontWeight=400
;;; Main font weight when highlighted
; MainFontWeightHi=700
;;; Sub font name
; SubFontName=Segoe UI
;;; Sub font size
; SubFontSize=12
;;; Sub font weight
; SubFontWeight=400
;;; Sub font name when highlighted
; SubFontNameHi=Segoe UI
;;; Sub font size when highlighted
; SubFontSizeHi=12
;;; Sub font weight when highlighted
; SubFontWeightHi=600
;;; Column font name
; ColFontName=Segoe UI
;;; Column font size
; ColFontSize=12
;;; Column font weight
; ColFontWeight=400
;;; Column font name when highlighted
; ColFontNameHi=Segoe UI
;;; Column font size when highlighted
; ColFontSizeHi=12
;;; Column font weight when highlighted
; ColFontWeightHi=600
;;; Show scrollbar when content overflows
; ScrollBarEnabled=true
;;; Scrollbar width in pixels
; ScrollBarWidthPx=6
;;; Scrollbar right margin in pixels
; ScrollBarMarginRightPx=8
;;; Scrollbar thumb color (ARGB)
; ScrollBarThumbARGB=0x88FFFFFF
;;; Show scrollbar gutter background
; ScrollBarGutterEnabled=false
;;; Scrollbar gutter color (ARGB)
; ScrollBarGutterARGB=0x30000000
;;; Show footer bar
; ShowFooter=true
;;; Footer border width in pixels
; FooterBorderPx=0
;;; Footer border color (ARGB)
; FooterBorderARGB=0x33FFFFFF
;;; Footer background corner radius
; FooterBGRadius=0
;;; Footer background color (ARGB)
; FooterBGARGB=0x0
;;; Footer text color (ARGB)
; FooterTextARGB=0xFFFFFFFF
;;; Footer font name
; FooterFontName=Segoe UI
;;; Footer font size
; FooterFontSize=14
;;; Footer font weight
; FooterFontWeight=600
;;; Footer height in pixels
; FooterHeightPx=24
;;; Gap between content and footer in pixels
; FooterGapTopPx=8
